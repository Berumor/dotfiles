context.modules = [
    {   name = libpipewire-module-combine-stream
        args = {
            combine.mode = sink
            node.name = "Headset + Speakers"
            node.description = "Headset + Speakers"
            combine.latency-compensate = false
            combine.props = {
                audio.position = [ FL FR ]
            }
            stream.props = {
                stream.dont-remix = true
            }
            stream.rules = [
                {   matches = [
                        {   media.class = "Audio/Sink"
                            node.name = "alsa_output.usb-Logitech_G733_Gaming_Headset_0000000000000000-00.analog-stereo"
                        }
                        {   media.class = "Audio/Sink"
                            node.name = "alsa_output.pci-0000_13_00.6.analog-stereo"
                        }
                    ]
                    actions = {
                        create-stream = {
                            audio.position = [ FL FR ]
                            combine.audio.position = [ FL FR ]
                        }
                    }
                }
            ]
        }
    }
]
